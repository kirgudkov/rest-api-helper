name: npm-publish

on:
  release:
    types: [ created ]

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: npm install
        run: npm install

      - name: build
        run: npm run build

      - name: test
        run: npm run test

      - name: publish
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_PUBLISH_SECRET }}
          tag: ${{ contains(github.event.release.tag_name, 'alpha') && 'alpha' || contains(github.event.release.tag_name, 'beta') && 'beta' || contains(github.event.release.tag_name, 'rc') && 'rc' || github.event.release.prerelease && 'next' || 'latest' }}
